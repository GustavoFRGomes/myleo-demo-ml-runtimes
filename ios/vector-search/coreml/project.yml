name: MyLeoVSCoreML
options:
  bundleIdPrefix: org.ggomes
  deploymentTarget:
    iOS: "17.0"
targets:
  MyLeoVSCoreML:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ggomes.myleo.vectorsearch.coreml
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
  MyLeoVSCoreMLTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: MyLeoVSCoreML
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  MyLeoVSCoreML:
    build:
      targets:
        MyLeoVSCoreML: all
    test:
      targets:
        - MyLeoVSCoreMLTests
