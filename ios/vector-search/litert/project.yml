name: MyLeoLite
options:
  bundleIdPrefix: org.ggomes
  deploymentTarget:
    iOS: "17.0"
targets:
  MyLeoLite:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ggomes.myleolite
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
  MyLeoLiteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: MyLeoLite
schemes:
  MyLeoLite:
    build:
      targets:
        MyLeoLite: all
    test:
      targets:
        - MyLeoLiteTests
