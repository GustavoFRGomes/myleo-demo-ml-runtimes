name: MyLeoVSOnnx
options:
  bundleIdPrefix: org.ggomes
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # CocoaPods resource scripts write under Pods/ and fail
    # under Xcode 26's user-script sandboxing.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  MyLeoVSOnnx:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Sources/OnnxRuntime-Bridging-Header.h
    info:
      path: Info.plist
    resources:
      - path: Sources/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ggomes.myleo.vectorsearch.onnx
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/OnnxRuntime-Bridging-Header.h
  MyLeoVSOnnxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: MyLeoVSOnnx
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  MyLeoVSOnnx:
    build:
      targets:
        MyLeoVSOnnx: all
    test:
      targets:
        - MyLeoVSOnnxTests
