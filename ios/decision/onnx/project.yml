name: MyLeoDecisionOnnx
options:
  bundleIdPrefix: org.ggomes
  deploymentTarget:
    iOS: "17.0"
packages:
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
settings:
  base:
    # CocoaPods resource scripts write under Pods/ and fail under Xcode 26's
    # user-script sandboxing.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  MyLeoDecisionOnnx:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Sources/OnnxRuntime-Bridging-Header.h
    dependencies:
      - package: swift-transformers
        product: Tokenizers
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ggomes.myleo.decision.onnx
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/OnnxRuntime-Bridging-Header.h
  MyLeoDecisionOnnxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: MyLeoDecisionOnnx
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  MyLeoDecisionOnnx:
    build:
      targets:
        MyLeoDecisionOnnx: all
    test:
      targets:
        - MyLeoDecisionOnnxTests
