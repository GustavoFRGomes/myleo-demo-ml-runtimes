name: MyLeoDecisionLiteRT
options:
  bundleIdPrefix: org.ggomes
  deploymentTarget:
    iOS: "17.0"
packages:
  LiteRTBinary:
    path: Packages/LiteRTBinary
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
settings:
  base:
    # CocoaPods resource scripts write under Pods/ and fail under Xcode 26's
    # user-script sandboxing.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  MyLeoDecisionLiteRT:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: swift-transformers
        product: Tokenizers
      - package: LiteRTBinary
        product: CLiteRT
      - package: LiteRTBinary
        product: LiteRtMetalAccelerator
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ggomes.myleo.decision.litert
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
  MyLeoDecisionLiteRTTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: MyLeoDecisionLiteRT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  MyLeoDecisionLiteRT:
    build:
      targets:
        MyLeoDecisionLiteRT: all
    test:
      targets:
        - MyLeoDecisionLiteRTTests
