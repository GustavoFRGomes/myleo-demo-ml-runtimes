name: MyLeoLLMCoreML
options:
  bundleIdPrefix: org.ggomes
  deploymentTarget:
    iOS: "17.0"
targets:
  MyLeoLLMCoreML:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ggomes.myleo.llm.coreml
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
  MyLeoLLMCoreMLTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: MyLeoLLMCoreML
schemes:
  MyLeoLLMCoreML:
    build:
      targets:
        MyLeoLLMCoreML: all
    test:
      targets:
        - MyLeoLLMCoreMLTests
